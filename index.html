<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Our Relationship Radar 🎀</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script defer src="https://unpkg.com/alpinejs@3.x.x/dist/cdn.min.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;800&family=Caveat:wght@700&display=swap" rel="stylesheet">
    
    <style>
        :root { --soft-pink: #fff0f3; --accent-pink: #ff8fac; }
        body { font-family: 'Plus Jakarta Sans', sans-serif; background-color: var(--soft-pink); overflow-x: hidden; }
        .font-handwritten { font-family: 'Caveat', cursive; }
        .glass { background: rgba(255, 255, 255, 0.45); backdrop-filter: blur(15px); -webkit-backdrop-filter: blur(15px); border: 1px solid rgba(255, 255, 255, 0.3); border-radius: 2rem; }
        .btn-primary { background: linear-gradient(135deg, #ff8fac 0%, #ff5c8d 100%); box-shadow: 0 10px 20px rgba(255, 92, 141, 0.3); }
        .btn-secondary { background: white; border: 2px solid #ff8fac; color: #ff5c8d; }
        .blob { position: absolute; width: 300px; height: 300px; background: linear-gradient(180deg, rgba(255,182,193,0.4) 0%, rgba(255,105,180,0.2) 100%); filter: blur(50px); border-radius: 50%; z-index: -1; animation: move 20s infinite alternate; }
        @keyframes move { from { transform: translate(-10%, -10%); } to { transform: translate(20%, 20%); } }
    </style>
</head>
<body x-data="loveApp()">

    <!-- Ornamen Background -->
    <div class="fixed inset-0 overflow-hidden -z-10">
        <div class="blob top-[-10%] left-[-10%]"></div>
        <div class="blob bottom-[-10%] right-[-10%]"></div>
    </div>

    <!-- MAIN CONTAINER -->
    <main class="min-h-screen max-w-md mx-auto px-6 py-8 flex flex-col justify-center items-center">

        <!-- ================= 1. DASHBOARD MENU ================= -->
        <div x-show="view === 'menu'" class="w-full space-y-4" x-transition>
            <div class="text-center bg-white/40 p-6 rounded-3xl border border-white/50 shadow-sm mb-2">
                <h1 class="text-2xl font-extrabold text-pink-600 tracking-tight">Relationship Dashboard 🎀</h1>
                <p class="text-xs text-gray-500 mt-1">Klik game di bawah buat mulai main bareng Lily & Irul</p>
            </div>

            <div class="space-y-3 max-h-[65vh] overflow-y-auto pr-1">
                <template x-for="(game, index) in games" :key="index">
                    <div class="glass p-4 flex items-center justify-between shadow-sm hover:scale-[1.01] transition-transform">
                        <div class="space-y-0.5 pr-2">
                            <span class="text-[10px] font-bold uppercase tracking-widest text-pink-500" x-text="'Menu ' + (index+1)"></span>
                            <h3 class="font-bold text-gray-800 text-sm leading-tight" x-text="game.title"></h3>
                        </div>
                        <button @click="selectGame(index)" class="btn-primary text-white text-xs font-bold px-4 py-2.5 rounded-xl whitespace-nowrap">Play</button>
                    </div>
                </template>
            </div>
        </div>

        <!-- ================= 2. SCREEN: COVER GAME ================= -->
        <div x-show="view === 'cover'" class="w-full text-center space-y-8" x-transition>
            <div class="text-7xl animate-bounce">🎀</div>
            <div class="glass p-8 space-y-4 shadow-sm">
                <h2 class="text-2xl font-extrabold text-pink-600 tracking-tight" x-text="activeGame().title"></h2>
                <p class="text-gray-600 italic text-xs leading-relaxed" x-text="activeGame().tagline"></p>
            </div>
            <button @click="handleCoverContinue()" class="btn-primary text-white px-12 py-4 rounded-full font-bold w-full uppercase tracking-wider text-sm">Continue</button>
        </div>

        <!-- ================= 3. SCREEN: OPENING PAGE & HOW TO PLAY (Menu 6-10) ================= -->
        <div x-show="view === 'opening'" class="w-full space-y-5" x-transition>
            <div class="glass p-6 shadow-sm space-y-4 text-center">
                <h2 class="text-xl font-extrabold text-pink-600" x-text="activeGame().title"></h2>
                <p class="text-xs text-gray-600 leading-relaxed" x-text="activeGame().description"></p>
            </div>

            <div class="glass p-5 shadow-sm space-y-2">
                <h3 class="text-xs font-bold uppercase tracking-wider text-pink-500">Cara Main:</h3>
                <ul class="text-xs text-gray-700 space-y-1 list-decimal list-inside font-semibold">
                    <template x-for="step in activeGame().caraMain">
                        <li x-text="step"></li>
                    </template>
                </ul>
            </div>

            <div class="glass p-5 shadow-sm space-y-3">
                <h3 class="text-xs font-bold uppercase tracking-wider text-pink-500">Rules:</h3>
                <ul class="text-xs text-pink-600 space-y-2 font-bold">
                    <template x-for="rule in activeGame().rules">
                        <li class="flex items-start gap-2"><span>🌸</span> <span x-text="rule"></span></li>
                    </template>
                </ul>
                <label class="flex items-center gap-3 pt-2 text-xs font-bold text-gray-700 cursor-pointer select-none">
                    <input type="checkbox" x-model="honestChecked" class="accent-pink-500 w-4 h-4 rounded">
                    <span x-text="activeGame().checkboxText || 'i promise to play honestly'"></span>
                </label>
            </div>

            <button :disabled="!honestChecked" @click="view = 'choosePlayer'" 
                    :class="honestChecked ? 'btn-primary text-white' : 'bg-gray-300 text-gray-500 cursor-not-allowed'"
                    class="px-12 py-4 rounded-full font-bold w-full uppercase tracking-wider text-sm transition-all shadow-md">
                Start Game
            </button>
        </div>

        <!-- ================= 4. SCREEN: RULES PAGE (Menu 1-5) ================= -->
        <div x-show="view === 'rules'" class="w-full space-y-6" x-transition>
            <h2 class="text-xl font-extrabold text-pink-600 text-center tracking-tight">Rules</h2>
            <div class="glass p-6 shadow-sm">
                <ul class="space-y-4 text-xs font-bold text-pink-600">
                    <template x-for="rule in activeGame().rules">
                        <li class="flex items-start gap-3">
                            <span>🌸</span>
                            <span x-text="rule"></span>
                        </li>
                    </template>
                </ul>
            </div>
            <button @click="startQuestions()" class="btn-primary text-white px-12 py-4 rounded-full font-bold w-full uppercase tracking-wider text-sm">I'm Ready</button>
        </div>

        <!-- ================= 5. SCREEN: CHOOSE PLAYER (Menu 6-10) ================= -->
        <div x-show="view === 'choosePlayer'" class="w-full text-center space-y-6" x-transition>
            <h2 class="text-2xl font-extrabold text-pink-600 tracking-tight">Who Are You?</h2>
            <div class="grid grid-cols-2 gap-4 w-full">
                <button @click="setPlayer('Lily 🌸')" class="glass p-6 text-xl font-bold text-pink-600 hover:scale-105 active:scale-95 transition-transform flex flex-col items-center gap-2">
                    <span class="text-4xl">🌸</span> Lily
                </button>
                <button @click="setPlayer('Irul ☕')" class="glass p-6 text-xl font-bold text-gray-700 hover:scale-105 active:scale-95 transition-transform flex flex-col items-center gap-2">
                    <span class="text-4xl">☕</span> Irul
                </button>
            </div>
        </div>

        <!-- ================= 6. SCREEN: QUESTION SLIDES ================= -->
        <div x-show="view === 'quiz'" class="w-full space-y-4" x-transition>
            <!-- Progress Bar -->
            <div class="w-full bg-pink-100 h-2.5 rounded-full overflow-hidden">
                <div class="bg-pink-500 h-full transition-all duration-300" :style="`width: ${(currentQuestionIndex + 1) / activeGame().questions.length * 100}%`"></div>
            </div>
            
            <div class="flex justify-between items-center text-xs text-gray-400 font-bold px-1">
                <span x-text="`Pertanyaan ${currentQuestionIndex + 1}/${activeGame().questions.length}`"></span>
                <span class="text-pink-400" x-text="player ? `Player: ${player}` : activeGame().title"></span>
            </div>

            <!-- Card Pertanyaan -->
            <div class="glass p-6 text-center min-h-[160px] flex flex-col items-center justify-center shadow-md">
                <p class="text-base font-bold text-gray-700 leading-snug" x-text="activeGame().questions[currentQuestionIndex].q || activeGame().questions[currentQuestionIndex]"></p>
            </div>

            <!-- Area Pilihan Tombol / Input Text -->
            <div class="space-y-3 w-full">
                <!-- TYPE 1: Cheating or No Cheating -->
                <template x-if="activeGame().type === 'cheating'">
                    <div class="grid grid-cols-2 gap-3">
                        <button @click="saveAnswer('Cheating 🚨')" class="btn-primary text-white py-4 rounded-2xl font-bold text-sm">Cheating 🚨</button>
                        <button @click="saveAnswer('No Cheating 😌')" class="btn-secondary py-4 rounded-2xl font-bold text-sm">No Cheating 😌</button>
                    </div>
                </template>

                <!-- TYPE 2: Green Flag or Red Flag -->
                <template x-if="activeGame().type === 'flag'">
                    <div class="grid grid-cols-2 gap-3">
                        <button @click="saveAnswer('Green Flag 💚')" class="bg-green-500 text-white py-4 rounded-2xl font-bold text-sm shadow-md">Green Flag 💚</button>
                        <button @click="saveAnswer('Red Flag 🚨')" class="bg-red-500 text-white py-4 rounded-2xl font-bold text-sm shadow-md">Red Flag 🚨</button>
                    </div>
                </template>

                <!-- TYPE 3: Who's More Likely To -->
                <template x-if="activeGame().type === 'likely'">
                    <div class="grid grid-cols-2 gap-3">
                        <button @click="saveAnswer('Lily 👩‍🦰')" class="btn-primary text-white py-4 rounded-2xl font-bold text-sm">Lily 👩‍🦰</button>
                        <button @click="saveAnswer('Irul 👨‍💻')" class="btn-secondary py-4 rounded-2xl font-bold text-sm">Irul 👨‍💻</button>
                    </div>
                </template>

                <!-- TYPE 4: This or That -->
                <template x-if="activeGame().type === 'thisthat'">
                    <div class="grid grid-cols-2 gap-3">
                        <button @click="saveAnswer(getOptions(activeGame().questions[currentQuestionIndex])[0])" class="btn-primary text-white py-4 px-2 rounded-2xl font-bold text-xs truncate" x-text="getOptions(activeGame().questions[currentQuestionIndex])[0]"></button>
                        <button @click="saveAnswer(getOptions(activeGame().questions[currentQuestionIndex])[1])" class="btn-secondary py-4 px-2 rounded-2xl font-bold text-xs truncate" x-text="getOptions(activeGame().questions[currentQuestionIndex])[1]"></button>
                    </div>
                </template>

                <!-- TYPE 5: Agreement Lama -->
                <template x-if="activeGame().type === 'agreement'">
                    <div class="grid grid-cols-2 gap-3">
                        <button @click="saveAnswer('Setuju 📑')" class="btn-primary text-white py-4 rounded-2xl font-bold text-sm">Setuju 📑</button>
                        <button @click="saveAnswer('Nego 😤')" class="btn-secondary py-4 rounded-2xl font-bold text-sm">Nego 😤</button>
                    </div>
                </template>

                <!-- TYPE 6: Multiple Choice 4 Opsi (Menu 8 - Relationship Emergency) -->
                <template x-if="activeGame().type === 'mc'">
                    <div class="grid grid-cols-1 gap-2">
                        <template x-for="(opt, idx) in activeGame().questions[currentQuestionIndex].options" :key="idx">
                            <button @click="submitMcAnswer(opt.score, opt.text)" 
                                    class="w-full p-3.5 rounded-xl text-left font-bold text-xs glass border border-pink-200 hover:bg-pink-100/50 transition-colors flex items-center gap-3 text-gray-700">
                                <span class="bg-pink-500 text-white w-5 h-5 rounded-md flex items-center justify-center text-[10px]" x-text="opt.key"></span>
                                <span x-text="opt.text"></span>
                            </button>
                        </template>
                    </div>
                </template>

                <!-- TYPE 7: Input Essay Ketik (Menu 6, 7, 9, 10) -->
                <template x-if="activeGame().type === 'essay'">
                    <div class="space-y-3">
                        <textarea x-model="textInput" placeholder="Ketik jawaban atau memorimu di sini..." 
                                  class="w-full p-4 rounded-2xl glass border border-pink-200 text-sm font-semibold text-gray-700 focus:outline-none focus:ring-2 focus:ring-pink-400 h-24 resize-none"></textarea>
                        <button @click="submitEssayAnswer()" :disabled="!textInput.trim()"
                                :class="textInput.trim() ? 'btn-primary text-white' : 'bg-gray-300 text-gray-500 cursor-not-allowed'"
                                class="w-full py-3.5 rounded-xl font-bold text-sm shadow-md transition-all">
                            Next Question ➡️
                        </button>
                    </div>
                </template>
            </div>
        </div>

        <!-- ================= 7. SCREEN: RESULT / REVIEW PAGE ================= -->
        <div x-show="view === 'result'" class="w-full space-y-6" x-transition>
            <div class="text-center space-y-2">
                <div class="text-5xl">😌</div>
                <h2 class="text-2xl font-extrabold text-pink-600 tracking-tight" x-text="activeGame().resultTitle || 'Your Answers Are In 😌'"></h2>
                <p class="text-xs text-gray-500" x-text="activeGame().resultSubtitle || 'nahh ini semua jawaban kamu, yuk review bareng satu-satu'"></p>
            </div>

            <!-- Badge Type Emergency Khusus Menu 8 -->
            <template x-if="activeGameIndex === 7">
                <div class="glass p-5 border-2 border-dashed border-pink-400 text-center space-y-1 bg-pink-100/30">
                    <span class="text-[10px] font-bold uppercase tracking-widest text-pink-500">Your Archetype Style</span>
                    <h3 class="text-lg font-extrabold text-pink-600" x-text="emergencyStyle"></h3>
                </div>
            </template>

            <!-- Render Box List Jawaban Sementara -->
            <div class="glass p-4 max-h-[300px] overflow-y-auto space-y-2 border border-pink-100 shadow-inner">
                <template x-for="(ans, idx) in currentAnswers" :key="idx">
                    <div class="bg-white/80 p-3 rounded-2xl border border-pink-50/50 flex flex-col gap-1 shadow-sm">
                        <p class="text-xs font-bold text-gray-700" x-text="`${idx + 1}. ${ans.q}`"></p>
                        <div class="text-[11px] font-extrabold text-pink-500 self-end bg-pink-50 px-2 py-0.5 rounded-lg" x-text="activeGame().type === 'essay' ? ans.a : `→ ${ans.a}`"></div>
                    </div>
                </template>
            </div>

            <!-- Panel Aksi Akhir -->
            <div class="text-center pt-2 space-y-3">
                <button @click="showCtaText = true" class="btn-primary text-white px-10 py-4 rounded-full font-bold w-full shadow-lg text-sm uppercase tracking-wider" x-text="activeGame().ctaButtonText || 'review bareng yuk'"></button>
                
                <div x-show="showCtaText" x-transition class="text-xs font-bold text-pink-500 bg-white/60 p-3 rounded-xl border border-pink-100">
                    sekarang waktunya bahas satu-satu. siap adu argumen? 😭🤍
                </div>

                <div class="grid grid-cols-2 gap-3 pt-2">
                    <button @click="resetGame()" class="btn-secondary py-3 rounded-2xl font-bold text-xs uppercase tracking-wider">Main Lagi</button>
                    <button @click="view = 'menu'" class="btn-primary text-white py-3 rounded-2xl font-bold text-xs uppercase tracking-wider shadow-none">Back to Games</button>
                </div>
            </div>
        </div>

    </main>

                    this.view = 'quiz';

                saveAnswer(selectedOption) {
                    let currentQuestionText = this.activeGame().questions[this.currentQuestionIndex];
                    this.currentAnswers.push({
                        q: currentQuestionText,
                        a: selectedOption
                    });
                    this.nextQuestionLogic();
                },

                    let currentQuestionText = this.activeGame().questions[this.currentQuestionIndex];

                        q: currentQuestionText,
                        a: this.textInput.trim()

                    this.textInput = '';
                    this.nextQuestionLogic();
                },
                submitMcAnswer(scoreCode, textLabel) {
                    let currentQuestionText = this.activeGame().questions[this.currentQuestionIndex].q;
                    this.currentAnswers.push({
                        q: currentQuestionText,
                        a: textLabel
                    });
                    this.emergencyScores[scoreCode]++;
                    this.nextQuestionLogic();
                },
                nextQuestionLogic() {
                    if (this.currentQuestionIndex < this.activeGame().questions.length - 1) {
                        this.currentQuestionIndex++;
                    } else {
                        if (this.activeGame().type === 'mc') {
                            this.calculateEmergencyStyle();
                        }
                        this.view = 'result';
                    }
                },
                calculateEmergencyStyle() {
                    let maxScore = 0;
                    let bestCode = 'A';
                    for (let key in this.emergencyScores) {
                        if (this.emergencyScores[key] > maxScore) {
                            maxScore = this.emergencyScores[key];
                            bestCode = key;
                        }
                    }
                    const styles = {
                        A: "🌷 The Calm Reassurer",
                        B: "☁️ The Soft Overthinker",
                        C: "⚡ The Direct Communicator",
                        D: "🤍 The Patient Listener",
                        E: "🫶 The Gentle Supporter"
                    };
                    this.emergencyStyle = styles[bestCode] || styles['A'];
                },

                    this.currentAnswers = [];
                    this.emergencyScores = { A: 0, B: 0, C: 0, D: 0, E: 0 };
